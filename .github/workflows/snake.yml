# Menghasilkan animasi "ular" yang memakan kotak kontribusi.
#
# Hasilnya (snake.svg) didorong ke branch `output`, lalu README memuatnya
# dari sana. Tanpa workflow ini, gambar ular di README akan 404.
#
# SETELAH PERTAMA KALI DIPASANG:
#   1. Buka tab Actions di repo ini
#   2. Pilih "Generate Snake" -> Run workflow (jangan menunggu jadwal)
#   3. Pastikan branch `output` terbentuk dan berisi snake.svg
#
# Kalau langkah push gagal dengan 403, buka
# Settings -> Actions -> General -> Workflow permissions,
# lalu pilih "Read and write permissions".

name: Generate Snake

on:
  schedule:
    # Setiap 12 jam. Kontribusi tidak berubah tiap menit, jadi lebih sering
    # dari ini hanya membuang kuota Actions tanpa hasil yang berbeda.
    - cron: "0 */12 * * *"
  # Supaya bisa dijalankan manual dari tab Actions.
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Buat snake.svg
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # Dua berkas: satu untuk mode terang, satu untuk gelap.
          outputs: |
            dist/snake.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark

      - name: Dorong ke branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
